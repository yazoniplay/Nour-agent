services:
  - type: web
    name: nour-agent
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: NOUR_DB_PATH
        value: /tmp/nour.db
      - key: NOUR_TASK_TIMEOUT_SECONDS
        value: "600"
      - key: NOUR_ACCESS_PASSWORD
        sync: false
